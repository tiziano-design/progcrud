<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Gimnasio - UTN</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div class="container">
    <h1>Gestión de Socios - Gimnasio</h1>

    <div class="auth-card">
      <form id="loginForm" class="login-form">
        <input type="email" id="loginEmail" placeholder="Email" required>
        <input type="password" id="loginPassword" placeholder="Contraseña" required>
        <button type="submit" id="btnLogin">Iniciar sesión</button>
        <button type="button" id="btnLogout" class="hidden">Cerrar sesión</button>
      </form>
      <div id="loginStatus" class="login-status">Iniciá sesión para usar la app.</div>
    </div>

    <div id="authNotice" class="auth-notice">Iniciá sesión para poder cargar y editar socios.</div>

    <div id="appContent" class="hidden">
      <div class="dashboard-cards">
        <div class="card total">
          <span>Total de Socios</span>
          <strong id="statsTotal">0</strong>
        </div>
        <div class="card activos">
          <span>Socios Activos</span>
          <strong id="statsActivos">0</strong>
        </div>
        <div class="card inactivos">
          <span>Socios Inactivos</span>
          <strong id="statsInactivos">0</strong>
        </div>
      </div>

      <div class="search-container">
        <input id="searchInput" type="text" placeholder="Buscar por nombre o DNI..." />
      </div>

      <div id="mensajeAccion" class="mensaje-accion hidden"></div>

      <form id="socioForm">
        <input type="hidden" id="socioId">
        <div class="form-group">
          <input type="text" id="nombre" placeholder="Nombre" required>
          <input type="text" id="apellido" placeholder="Apellido" required>
        </div>
        <div class="form-group">
          <input type="text" id="dni" placeholder="DNI" required>
          <select id="plan" required>
            <option value="">Seleccionar Plan</option>
            <option value="Pase Libre">Pase Libre</option>
            <option value="Musculación">Musculación</option>
            <option value="Crossfit">Crossfit</option>
          </select>
        </div>
        <div class="form-group">
          <input type="date" id="fechaPago" placeholder="Fecha de pago">
        </div>
        <button type="submit" id="btnGuardar">Guardar Socio</button>
        <button type="button" id="btnCancelar" class="hidden">Cancelar</button>
      </form>

      <table id="tablaSocios">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>DNI</th>
            <th>Plan</th>
            <th>Fecha Pago</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
    </div>
  </div>
  <script src="./src/main.js"></script>
</body>
</html>
